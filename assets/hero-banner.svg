<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Davey Rockets - Full-Stack DeFi Engineer</title>
  <desc id="desc">Finance background applied to secure onchain products. San Diego.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="55%" stop-color="#282828"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFBD19"/>
      <stop offset="100%" stop-color="#8000FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#8000FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8000FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g opacity="0.08" stroke="#F3EACC" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320M900 0V320M1050 0V320"/>
  </g>

  <g transform="translate(72 78)">
