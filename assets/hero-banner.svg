  <circle cx="1110" cy="250" r="7" fill="#8000FF"/>
  <text x="872" y="278" fill="#9CA3AF" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12">M and A rigor</text>
  <text x="1078" y="278" fill="#9CA3AF" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12">DeFi design</text>
