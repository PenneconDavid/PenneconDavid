    <path d="M8 78c-7 9-10 20-10 30 0 2 7 3 11 1 3-9 6-16 0-31zM56 78c7 9 10 20 10 30 0 2-7 3-11 1-3-9-6-16 0-31z" fill="#EFBD19" opacity="0.9"/>
