<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Davey Rockets - Full-Stack Engineer</title>
  <desc id="desc">End-to-end products from schema to UI. San Diego.</desc>
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="70%" stop-color="#17141F"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="orbitAccent" x1="0%" y1="0%" x2="100%" y2="0%">
