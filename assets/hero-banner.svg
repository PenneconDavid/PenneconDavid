    <path d="M30 118l18-12 18 12-8 18H38l-8-18z" fill="#8000FF"/>
    <path d="M18 92c-8 10-12 22-12 34 0 2 8 4 12 2 4-10 8-18 0-36zM78 92c8 10 12 22 12 34 0 2-8 4-12 2-4-10-8-18 0-36z" fill="#EFBD19" opacity="0.85"/>
